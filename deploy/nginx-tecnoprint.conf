# Site de nginx para TecnoPrint.
# Reemplaza al proxy actual 'impresoras' (print.example.com -> :631).
# El admin clásico de CUPS sigue accesible directamente en http://192.0.2.55:631
server {
    listen 80;
    listen 443 ssl;
    server_name print.example.com;

    ssl_certificate     /etc/nginx/ssl/impresoras.crt;
    ssl_certificate_key /etc/nginx/ssl/impresoras.key;

    client_max_body_size 60M;

    # Frontend compilado (React/Vite)
    root /opt/tecnoprint/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # API del backend
    location /api/ {
        proxy_pass http://127.0.0.1:3311;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
